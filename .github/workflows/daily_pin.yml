name: USA Pinterest Auto Poster

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests Pillow huggingface_hub gradio_client

      - name: Generate AI Pins and Update RSS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python auto_pin.py

      - name: Save and Publish to Website
        run: |
          git config user.name "Catherine Auto Bot"
          git config user.email "bot@catherinewilliamshub.github.io"
          git add -A
          git commit -m "Update 5 boards with Official FLUX.1 HD images" || exit 0
          git push
