name: USA Pinterest Auto Poster

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৬:০০টায় নতুন পিন তৈরি হবে
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Generate AI Pins and Update RSS Feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python auto_pin.py

      - name: Save and Publish to Website
        run: |
          git config user.name "Catherine Auto Bot"
          git config user.email "bot@catherinewilliamshub.github.io"
          git add .
          git commit -m "Auto-update daily Pinterest RSS feeds" || exit 0
          git push
